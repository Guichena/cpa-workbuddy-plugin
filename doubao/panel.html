<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>豆包 Provider 面板</title>
<style>
/* Theme tokens aligned with CPA management panel (key-policy / themes.scss):
   default :root = light (paper); data-theme=white | dark; embedded iframe syncs parent. */
:root{
  --bg:#faf9f5;--card:#ffffff;--border:#e3e1db;--fg:#2d2a26;--mut:#6d6760;
  --acc:#4c8dff;--on-acc:#ffffff;--ok:#10b981;--warn:#e0aa14;--err:#c65746;
  --surface:#f0eee8;--btn-sec:#eef1f6;--btn-sec-hover:#e4e8ef;
  --input-bg:#ffffff;--placeholder:rgba(109,103,96,.55);
  --ok-soft:rgba(16,185,129,.10);--ok-border:rgba(16,185,129,.30);
  --warn-soft:rgba(224,170,20,.12);--warn-border:rgba(224,170,20,.32);
  --err-soft:rgba(198,87,70,.10);--err-border:rgba(198,87,70,.30);
  --radius-md:12px;--radius-lg:16px;--acc-ring:rgba(76,141,255,.18);
  color-scheme:light
}
:root[data-theme="white"]{
  --bg:#f5f5f5;--card:#ffffff;--border:#e6e6e6;--fg:#1f1f1f;--mut:#707070;
  --surface:#fafafa;--btn-sec:#f0f0f0;--btn-sec-hover:#e8e8e8;
  --input-bg:#ffffff;--placeholder:rgba(112,112,112,.55);
  color-scheme:light
}
:root[data-theme="dark"]{
  --bg:#1e1d1b;--card:#26241f;--border:#3a3833;--fg:#ede9e3;--mut:#9a948c;
  --acc:#4c8dff;--on-acc:#ffffff;--ok:#34d399;--warn:#f0c050;--err:#e07a6a;
  --surface:#2f2d28;--btn-sec:#35332e;--btn-sec-hover:#3f3c36;
  --input-bg:#1e1d1b;--placeholder:rgba(154,148,140,.55);
  --ok-soft:rgba(52,211,153,.12);--ok-border:rgba(52,211,153,.38);
  --warn-soft:rgba(240,192,80,.14);--warn-border:rgba(240,192,80,.38);
  --err-soft:rgba(224,122,106,.12);--err-border:rgba(224,122,106,.38);
  --acc-ring:rgba(76,141,255,.28);
  color-scheme:dark
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:1400px;margin:0 auto;padding:24px 20px}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--mut);font-size:13px;margin-bottom:20px}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
button{background:var(--acc);color:var(--on-acc);border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:13px}
button.sec{background:var(--btn-sec);color:var(--fg)}
button.sec:hover{background:var(--btn-sec-hover)}
button:disabled{opacity:.5;cursor:default}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-md);padding:16px}
.card h2{font-size:14px;margin:0 0 10px}
.card .row{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin:4px 0;gap:8px}
.card .row .v{color:var(--fg)}
.empty{background:var(--card);border:1px dashed var(--border);border-radius:var(--radius-md);padding:28px;text-align:center;color:var(--mut);font-size:13px}
.msg{margin-top:14px;padding:10px 14px;border-radius:8px;font-size:13px;display:none}
.msg.ok{display:block;background:var(--ok-soft);border:1px solid var(--ok-border);color:var(--ok)}
.msg.err{display:block;background:var(--err-soft);border:1px solid var(--err-border);color:var(--err)}
.import{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-md);padding:16px;margin-bottom:16px}
.import h2{font-size:14px;margin:0 0 6px}
.import ol{margin:6px 0 10px;padding-left:20px;color:var(--mut);font-size:12px;line-height:1.8}
.import textarea{width:100%;box-sizing:border-box;min-height:88px;border:1px solid var(--border);border-radius:8px;padding:9px 11px;font:12px/1.5 ui-monospace,Consolas,monospace;background:var(--input-bg);color:var(--fg);outline:none;resize:vertical}
.import textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-ring)}
.import .row{display:flex;gap:8px;align-items:center;margin-top:10px}
.import input[type=text]{flex:0 1 220px;background:var(--input-bg);border:1px solid var(--border);border-radius:8px;padding:7px 11px;color:var(--fg);font-size:13px;outline:none}
.import input[type=text]:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-ring)}
.card .acts{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.card .acts button{padding:5px 10px;font-size:12px}
.badge{font-size:11px;padding:2px 7px;border-radius:999px}
.badge.on{background:var(--ok-soft);color:var(--ok);border:1px solid var(--ok-border)}
.badge.off{background:var(--err-soft);color:var(--err);border:1px solid var(--err-border)}
</style>
</head>
<body>
<div class="wrap">
  <h1>豆包 Provider</h1>
  <div class="sub">导入浏览器登录态后，本插件把豆包账号能力以 OpenAI 兼容接口提供给 CPA。</div>

  <div class="import">
    <h2>导入登录态</h2>
    <ol>
      <li>在浏览器打开并登录 <code>https://www.doubao.com</code></li>
      <li>开发者工具 → Application → Cookies → <code>https://www.doubao.com</code></li>
      <li>复制完整 Cookie header（须含 <code>flow_cur_user_sec_id</code> 与 <code>sessionid</code>）</li>
      <li>粘贴到下方文本框，点击「导入」</li>
    </ol>
    <textarea id="cookie" placeholder="flow_cur_user_sec_id=...; sessionid=...; ttwid=..."></textarea>
    <div class="row">
      <input type="text" id="label" placeholder="备注名（可选）">
      <button id="import">导入</button>
    </div>
  </div>

  <div class="bar">
    <button id="refresh" class="sec">刷新账号</button>
    <span class="sub" id="count" style="margin:0"></span>
  </div>

  <div id="list"></div>
  <div class="msg" id="msg"></div>
</div>

<script>
const API = "/v0/management/plugins/doubao-provider";

async function api(path, opts) {
  const headers = Object.assign({ "Content-Type": "application/json" }, (opts && opts.headers) || {});
  const res = await fetch(API + path, Object.assign({}, opts, { headers, cache: "no-store" }));
  let data = null;
  try { data = await res.json(); } catch (e) { data = { error: "响应解析失败" }; }
  return data;
}

function showMsg(text, kind) {
  const el = document.getElementById("msg");
  el.className = "msg " + (kind || "");
  el.textContent = text;
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

function renderAccounts(accounts) {
  const list = document.getElementById("list");
  document.getElementById("count").textContent = "共 " + accounts.length + " 个账号";
  if (!accounts.length) {
    list.innerHTML = '<div class="empty">暂无账号。请在上方粘贴浏览器 Cookie 完成导入。</div>';
    return;
  }
  list.innerHTML = accounts.map(function (a) {
    const id = esc(a.auth_id);
    return '<div class="card"><h2><span class="name">' + esc(a.label || a.auth_id || "未命名") + '</span>' +
      '<span class="badge ' + (a.disabled ? "off" : "on") + '">' + (a.disabled ? "已禁用" : "已启用") + '</span></h2>' +
      (a.screen_name ? '<div class="row"><span>昵称</span><span class="v">' + esc(a.screen_name) + '</span></div>' : '') +
      (a.mobile ? '<div class="row"><span>手机</span><span class="v">' + esc(a.mobile) + '</span></div>' : '') +
      '<div class="row"><span>账号标识</span><span class="v">' + esc(a.sec_user_id || a.auth_id) + '</span></div>' +
      '<div class="row"><span>更新于</span><span class="v">' + esc(a.updated_at || "-") + '</span></div>' +
      '<div class="acts">' +
      '<button class="sec" data-act="' + (a.disabled ? "enable" : "disable") + '" data-id="' + id + '">' + (a.disabled ? "启用" : "禁用") + '</button>' +
      '<button class="sec" data-act="delete" data-id="' + id + '">删除</button>' +
      '</div></div>';
  }).join("");
}

async function refresh() {
  const btn = document.getElementById("refresh");
  btn.disabled = true;
  try {
    const data = await api("/accounts");
    if (data && data.error) { showMsg("加载账号失败：" + data.error, "err"); return; }
    renderAccounts((data && data.accounts) || []);
  } catch (e) {
    showMsg("加载账号失败：" + e.message, "err");
  } finally {
    btn.disabled = false;
  }
}

async function doImport() {
  const btn = document.getElementById("import");
  const cookie = document.getElementById("cookie").value.trim();
  const label = document.getElementById("label").value.trim();
  if (!cookie) { showMsg("请先粘贴 Cookie", "err"); return; }
  btn.disabled = true;
  showMsg("正在校验登录态…", "");
  try {
    const data = await api("/import", { method: "POST", body: JSON.stringify({ cookie: cookie, label: label }) });
    if (data && data.ok) {
      document.getElementById("cookie").value = "";
      document.getElementById("label").value = "";
      showMsg("导入成功：" + (data.label || data.auth_id || ""), "ok");
      refresh();
    } else {
      showMsg("导入失败：" + ((data && data.error) || "未知错误"), "err");
    }
  } catch (e) {
    showMsg("导入失败：" + e.message, "err");
  } finally {
    btn.disabled = false;
  }
}

async function act(id, action) {
  const path = action === "delete" ? "/delete" : (action === "enable" ? "/enable" : "/disable");
  try {
    const data = await api(path, { method: "POST", body: JSON.stringify({ auth_id: id }) });
    if (data && data.ok) { showMsg("操作成功", "ok"); refresh(); }
    else { showMsg("操作失败：" + ((data && data.error) || "未知错误"), "err"); }
  } catch (e) {
    showMsg("操作失败：" + e.message, "err");
  }
}

document.getElementById("import").addEventListener("click", doImport);
document.getElementById("refresh").addEventListener("click", refresh);
document.getElementById("list").addEventListener("click", function (ev) {
  const btn = ev.target.closest("button[data-act]");
  if (!btn) return;
  const id = btn.getAttribute("data-id");
  const action = btn.getAttribute("data-act");
  if (action === "delete") {
    if (!confirm("确认删除该账号？")) return;
    act(id, "delete");
  } else {
    act(id, action);
  }
});

// 主题跟随宿主 iframe / 系统偏好
(function syncTheme() {
  try {
    const t = new URLSearchParams(location.search).get("theme");
    if (t) { document.documentElement.setAttribute("data-theme", t); return; }
    const parentTheme = window.parent && window.parent !== window
      ? window.parent.document.documentElement.getAttribute("data-theme") : null;
    if (parentTheme) document.documentElement.setAttribute("data-theme", parentTheme);
  } catch (e) { /* 跨域父页面不可读时忽略，使用默认亮色 */ }
})();

refresh();
</script>
</body>
</html>
